name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          # Pinned so new default rules in a ruff release can't break CI on unrelated PRs.
          # Bump deliberately: run `uvx ruff@<new> check .` and fix findings in the same PR.
          version: "0.17.6"

  public-safety:
    # This repo is public but its tools handle personal data: fail on data files, personal
    # identifiers (emails, calendar IDs, tailnet names) and secrets in tracked files.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_public_safety.py

  gitleaks:
    # Secret scan of the commits in this push / pull request.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tool:
          - amazon-orders-sync/server
          - anthropic-usage-tracker
          - apple-health-export
          - google-takeout-focused
          - location-data-duckdb
          - music-history
          - personal-data-reflection
          - strava-data-puller
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Every tool has a pyproject.toml, a uv.lock and a `dev` extra with pytest.
      # --locked fails if uv.lock is stale, and `uv run` uses the project's own
      # .venv, so a missing dependency or a failing test fails the job.
      - name: Install
        working-directory: ${{ matrix.tool }}
        run: uv sync --locked --extra dev --python 3.13
      - name: Test
        working-directory: ${{ matrix.tool }}
        run: uv run --no-sync python -m pytest tests/ -v --tb=short

  # Shared storage code uses stdlib unittest rather than a pytest project.
  # unittest exits non-zero on failures and when no tests are found.
  storage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Test datalake-paths (stdlib only)
        run: uv run --no-project --python 3.13 python -m unittest discover -s datalake-paths/tests -v
      - name: Test data-storage (pinned requirements)
        run: >-
          uv run --no-project --python 3.13
          --with-requirements data-storage/requirements.txt
          python -m unittest discover -s data-storage/tests -v

  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: amazon-orders-sync/extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm test
      - run: node scripts/build.mjs all
