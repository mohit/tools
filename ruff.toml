# Single ruff config for the repo. (A `.ruff.toml` next to this file would take precedence
# and silently replace it, so keep all settings here.)
target-version = "py311"
line-length = 120

[lint]
# Keep ruff's default rule set and add these families in full.
extend-select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E501",   # line length handled by formatter
    "SIM103", # `return bool(cond)` rewrites hurt readability in guard-style checks
]

[lint.per-file-ignores]
"tests/**" = ["B", "SIM"]
"**/test_*.py" = ["B", "SIM"]
# Tests catch Exception inside worker threads to hand it back to the main thread,
# where it is asserted on; narrowing would let unexpected errors vanish silently.
"**/tests/**" = ["BLE001"]
# Top-level CLI command handlers: report any failure with a traceback and exit non-zero.
"personal-data-reflection/reflect.py" = ["BLE001"]

# location-data-duckdb declares requires-python >=3.10; keep 3.11-only rewrites
# (datetime.UTC, fromisoformat accepting "Z") from being suggested there.
[per-file-target-version]
"location-data-duckdb/**" = "py310"

[format]
quote-style = "double"
