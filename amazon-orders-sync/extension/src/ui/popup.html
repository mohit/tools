<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Amazon Orders Sync</title>
  <link rel="stylesheet" href="ui.css">
</head>
<body class="popup">
  <h1>Amazon Orders Sync</h1>

  <div class="row"><span class="k">Server</span><span id="server"><span class="dot"></span>…</span></div>
  <div class="row"><span class="k">Cached, not yet sent</span><span id="queued">…</span></div>
  <div class="row" id="dead-row" hidden><span class="k">Rejected by server</span><span id="dead">0</span></div>
  <div class="row"><span class="k">Last delivered</span><span id="last-flush">—</span></div>
  <div class="row"><span class="k">Last crawl</span><span id="last-crawl">—</span></div>
  <div class="row" id="progress-row" hidden><span class="k">Crawling</span><span id="progress"></span></div>

  <div class="actions">
    <button class="primary" id="crawl-recent" title="Order history for the last 3 months, plus returns">Sync recent</button>
    <button id="crawl-full" title="Every year in your order history. Slow: a few seconds per page.">Full backfill</button>
    <button id="stop" hidden>Stop</button>
  </div>
  <div class="actions">
    <button id="flush">Send cache now</button>
    <button id="export">Download cache</button>
    <button id="requeue" hidden>Retry rejected</button>
  </div>
  <div class="msg" id="msg"></div>
  <div class="actions"><a href="#" id="open-options">Settings</a></div>

  <script src="../shared/browser.js"></script>
  <script src="popup.js"></script>
</body>
</html>
