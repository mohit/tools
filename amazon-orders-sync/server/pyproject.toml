[project]
name = "amazon-orders-sync-server"
version = "0.1.0"
description = "Tailscale-hosted ingest server for the Amazon Orders Sync browser extension (DuckDB + Parquet)"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1.0",
    "flask>=3.0.0",
    "datalake-paths",
]

[project.scripts]
amazon-orders-server = "amazon_orders_server:main"

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[dependency-groups]
dev = ["pytest>=8.0.0"]

[tool.uv]
package = false

[tool.uv.sources]
datalake-paths = { path = "../../datalake-paths", editable = true }
