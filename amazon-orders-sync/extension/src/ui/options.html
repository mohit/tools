<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Amazon Orders Sync — Settings</title>
  <link rel="stylesheet" href="ui.css">
</head>
<body>
  <main class="page">
    <h1>Amazon Orders Sync</h1>
    <p class="hint">Orders are cached in this browser and delivered to your ingest server on the tailnet whenever it is reachable.</p>

    <h2>Server</h2>
    <label for="serverUrl">Server URL
      <div class="hint">e.g. <code>https://datalake.your-tailnet.ts.net</code> (via <code>tailscale serve</code>) or <code>http://100.x.y.z:8765</code></div>
    </label>
    <input type="url" id="serverUrl" placeholder="https://host.tailnet.ts.net" autocomplete="off">

    <label for="token">Access token
      <div class="hint">Must match <code>AMAZON_SYNC_TOKEN</code> on the server.</div>
    </label>
    <input type="password" id="token" autocomplete="off">

    <div class="actions">
      <button class="primary" id="save">Save</button>
      <button id="test">Test connection</button>
    </div>
    <div class="msg" id="msg"></div>

    <h2>Crawling</h2>
    <label for="autoCrawlHours">Auto-sync interval (hours)
      <div class="hint">When any amazon.com tab is open and the last sync is older than this, quietly sync recent orders. 0 turns it off; pages you visit are still captured.</div>
    </label>
    <input type="number" id="autoCrawlHours" min="0" step="1">

    <label for="requestDelayMs">Delay between Amazon page requests (ms)
      <div class="hint">Keep this polite; lower values risk CAPTCHAs.</div>
    </label>
    <input type="number" id="requestDelayMs" min="500" step="100">

    <label for="refreshDetailDays">Re-check orders placed within (days)
      <div class="hint">Order detail pages for recent orders are re-read periodically to pick up deliveries, returns and refunds.</div>
    </label>
    <input type="number" id="refreshDetailDays" min="0" step="1">

    <label><input type="checkbox" id="captureRawHtml"> Keep page HTML snippets in the raw layer
      <div class="hint">Lets the server re-parse history when Amazon changes its layout. Larger payloads.</div>
    </label>

    <h2>Maintenance</h2>
    <div class="actions">
      <button id="reset">Re-send everything on next sync</button>
    </div>
    <div class="msg" id="msg2"></div>
  </main>
  <script src="../shared/browser.js"></script>
  <script src="../shared/constants.js"></script>
  <script src="options.js"></script>
</body>
</html>
